[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palisade"
version = "0.3.0"
description = "An assumption-minimal, hash-based accountable log for long-horizon provenance"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Tsolmondorj Natsagdorj" }]
keywords = [
    "post-quantum",
    "hash-based-signatures",
    "transparency-log",
    "provenance",
    "merkle-tree",
    "byzantine-fault-tolerance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = []

[project.optional-dependencies]
# `cryptography` is a TEST-ONLY dependency: the sigsum interop tests sign
# byte-exact Ed25519 over a foreign format. The runtime package remains
# zero-dependency and hash-only -- that is the project's whole thesis.
dev = ["pytest>=7", "cryptography>=41"]

[project.scripts]
palisade = "palisade.cli:main"

[project.urls]
Homepage = "https://github.com/0xSoftBoi/palisade"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
